<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bili Cache</title>
<style>
  *{box-sizing:border-box}body{width:344px;margin:0;padding:20px;font:13px/1.5 system-ui,sans-serif;color:#202124;background:#fff}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:16px;margin:0;font-weight:600}small{color:#6b7280;font-size:11px}p{color:#5f6368;margin:10px 0 14px;overflow-wrap:anywhere}button{width:100%;padding:9px 12px;border:1px solid #d9dce1;border-radius:6px;background:#fff;color:#30343b;cursor:pointer;font:inherit}button:hover:not(:disabled){background:#f3f4f6}button:focus-visible{outline:2px solid #1a73e8;outline-offset:2px}#show{background:#1a73e8;border-color:#1a73e8;color:#fff;font-weight:500}#show:hover:not(:disabled){background:#1765cc}button:disabled{opacity:.45;cursor:default}section{border-top:1px solid #e5e7eb;margin-top:20px;padding-top:16px}h2{font-size:12px;font-weight:600;margin:0}#status:empty{display:none}
  ul{list-style:none;padding:0;margin:12px 0;max-height:270px;overflow:auto}li{position:relative;padding:10px 58px 10px 0;border-top:1px solid #eee}li a,li span{display:block;color:inherit;text-decoration:none;overflow-wrap:anywhere}li a:hover{text-decoration:underline}li small{display:block;margin-top:4px}.delete{position:absolute;right:0;top:10px;width:auto;padding:4px 7px}form{display:flex;align-items:center;gap:6px;margin-top:14px}form label{flex:1;font-size:12px}input{width:58px;padding:5px;border:1px solid #d9dce1;border-radius:4px}form button{width:auto;padding:5px 8px}
</style>
<header><h1>Bili Cache</h1><small>0.7.0</small></header>
<p>Cache a Bilibili video at its current quality.</p>
<button id="show">Enable on this tab</button>
<p id="status" role="status"></p>
<section aria-label="Saved videos">
  <h2>Saved videos</h2>
  <p id="storage-status" role="status">Checking storage...</p>
  <ul id="saved-list" aria-label="Saved videos"></ul>
  <button id="clear-all" disabled>Delete all saved videos</button>
  <form id="limit-form"><label for="storage-limit">Storage limit (GB)</label><input id="storage-limit" type="number" min="1" max="512" step="1" required><button>Apply</button></form>
</section>
<script src="cache-db.js"></script><script src="storage-manager.js"></script><script src="popup.js"></script>
</html>
